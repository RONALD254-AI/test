<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Group Chat</title>
  <link rel="stylesheet" href="stylechat.css"/>
</head>
<body>
  <!-- Modal for name input -->
  <div id="nameModal" class="modal">
    <div class="modal-content">
      <h2>Enter Your Chat Name</h2>
      <input type="text" id="nameInput" placeholder="e.g., Ronald, Aisha..." />
      <button id="nameSubmit">Join Chat</button>
    </div>
  </div>

  <div class="chat-container hidden">
    <div class="chat-header">
      <img src="https://i.pravatar.cc/40?img=1" alt="Profile" class="chat-avatar" />
      <span class="chat-title">Group Chat Room</span>
    </div>
    <div class="chat-box" id="chat-box"></div>
    <div class="chat-input">
      <input type="text" id="message" placeholder="Type a message..." />
      <button id="send-btn">Send</button>
    </div>
  </div>

  <script src="script.js"></script>
</body>
</html>
